[package]
name = "structura"
version = "0.3.2"
description = "Biblical text analysis workbench"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
png    = "0.17"
tokio  = { version = "1", features = ["net", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2             = "0.6.4"
objc2-web-kit    = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit    = { version = "0.3.2", features = ["NSImage", "NSBitmapImageRep", "NSFontManager"] }
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString"] }
block2           = "0.6.2"
